<div class="docux-shell">
  <aside class="docux-sidebar">
    <div class="docux-brand" title="Hover to expand sidebar">
      <span class="docux-brand__mark">D</span>

      <span class="docux-brand__text">
        <strong>DocuX AI</strong>
        <small>Private Document Intelligence</small>
      </span>
    </div>

    <nav class="docux-sidebar__nav" aria-label="Main navigation">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        class="docux-sidebar__link"
        [title]="item.label"
      >
        <span class="docux-sidebar__icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11.5 12 5l8 6.5"></path>
            <path d="M6.5 10.5V19h11v-8.5"></path>
            <path d="M10 19v-5h4v5"></path>
          </svg>

          <svg *ngSwitchCase="'documents'" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 3.5h7l3 3V20.5H7z"></path>
            <path d="M14 3.5v4h4"></path>
            <path d="M9.5 11h5"></path>
            <path d="M9.5 14h5"></path>
            <path d="M9.5 17h3"></path>
          </svg>

          <svg *ngSwitchCase="'approvals'" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12.5 9.2 17 19 7"></path>
          </svg>

          <svg *ngSwitchCase="'workflows'" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h7a4 4 0 0 1 0 8H8"></path>
            <path d="M10 4 7 7l3 3"></path>
            <path d="M14 20l3-3-3-3"></path>
          </svg>

          <svg *ngSwitchCase="'notifications'" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-2.5 7-2.5 7h17S18 16 18 9"></path>
            <path d="M10 20h4"></path>
          </svg>

          <svg *ngSwitchDefault viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"></path>
          </svg>
        </span>

        <span class="docux-sidebar__label">{{ item.label }}</span>
      </a>
    </nav>
  </aside>

  <div class="docux-main">
    <header class="docux-header">
      <div>
        <h2>DocuX Workspace</h2>
        <p>Secure AI document processing and review</p>
      </div>

      <div class="docux-header__actions">
        <div class="docux-header__user">
          <strong>admin</strong>
          <span>company_admin</span>
        </div>

        <button type="button" class="docux-header__logout" (click)="logout()">
          Logout
        </button>
      </div>
    </header>

    <main class="docux-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <button
    type="button"
    class="docux-ai-fab"
    aria-label="Open DocuX AI"
    title="Open DocuX AI"
    (click)="openAiChat()"
    (mouseenter)="handleAiFabMouseEnter()"
    (mouseleave)="handleAiFabMouseLeave()"
  >
    <span class="docux-ai-fab__glow"></span>

    <span class="docux-ai-fab__icon-stage" aria-hidden="true">
      <ng-container
        *ngFor="
          let visual of floatingAiVisuals;
          let i = index;
          trackBy: trackFloatingAiVisual
        "
      >
        <span
          class="docux-ai-fab__icon-layer"
          [class.docux-ai-fab__icon-layer--active]="
            i === activeFloatingAiVisualIndex
          "
        >
          <img
            *ngIf="visual.kind === 'image'"
            [src]="visual.value"
            [alt]="visual.alt"
            class="docux-ai-fab__image"
          />

          <span
            *ngIf="visual.kind === 'emoji'"
            class="docux-ai-fab__emoji"
            [attr.aria-label]="visual.alt"
          >
            {{ visual.value }}
          </span>
        </span>
      </ng-container>
    </span>

    <span class="docux-ai-fab__popup">
      <span class="docux-ai-fab__popup-title">DocuX AI</span>
      <span class="docux-ai-fab__popup-subtitle">
        Smart document assistant
      </span>
    </span>
  </button>
</div>
