<div class="min-h-screen bg-slate-50 text-slate-950">
  <aside class="fixed left-0 top-0 z-30 h-screen w-64 border-r border-slate-200 bg-white px-5 py-6">
    <div class="mb-10">
      <h1 class="text-xl font-bold tracking-tight">DocuX AI</h1>
      <p class="mt-1 text-sm text-slate-500">Private Document Intelligence</p>
    </div>

    <nav class="space-y-2">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        Dashboard
      </a>

      <a
        routerLink="/documents/internal"
        routerLinkActive="active"
        class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        Documents
      </a>

      <a
        routerLink="/ai/internal"
        routerLinkActive="active"
        class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        AI Chat
      </a>

      <a
        routerLink="/approvals"
        routerLinkActive="active"
        class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        Approvals
      </a>

      <a
        routerLink="/workflows"
        routerLinkActive="active"
        class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        Workflows
      </a>

      <a
        routerLink="/notifications"
        routerLinkActive="active"
        class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        Notifications
      </a>
    </nav>
  </aside>

  <div class="min-h-screen pl-64">
    <header class="flex items-center justify-between border-b border-slate-200 bg-white px-8 py-5">
      <div>
        <h2 class="text-xl font-semibold">DocuX Workspace</h2>
        <p class="text-sm text-slate-500">Secure AI document processing and review</p>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right text-sm">
          <div class="font-semibold">admin</div>
          <div class="text-slate-500">company_admin</div>
        </div>

        <button
          type="button"
          class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-medium"
          (click)="logout()"
        >
          Logout
        </button>
      </div>
    </header>

    <main class="p-8">
      <router-outlet />
    </main>
  </div>
</div>
