<div class="ui-metric">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="metric-label">{{ title }}</p>
      <p class="metric-value mt-3">
        {{ value }}
      </p>
    </div>

    <div class="metric-tag">
      {{ badge }}
    </div>
  </div>

  <p *ngIf="subtitle" class="mt-4 text-sm text-slate-500">
    {{ subtitle }}
  </p>
</div>
