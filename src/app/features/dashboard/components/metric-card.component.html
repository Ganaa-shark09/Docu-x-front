<div class="ui-metric" [class.ui-metric--primary]="tone === 'primary'" [class.ui-metric--warning]="tone === 'warning'">
  <div class="metric-topline"><span class="metric-label">{{ title }}</span><span class="metric-tag">{{ badge }}</span></div>
  <p class="metric-value">{{ value }}</p>
  <p *ngIf="subtitle" class="metric-subtitle">{{ subtitle }}</p>
  <div class="metric-bottomline" aria-hidden="true"></div>
</div>
