<form [formGroup]="form" (ngSubmit)="submit()" class="chat-input">
  <textarea
    formControlName="message"
    rows="1"
    class="chat-input__textarea"
    placeholder="Message DocuX AI..."
    (keydown)="handleKeydown($event)"
  ></textarea>

  <button
    type="submit"
    [disabled]="form.invalid || isSending"
    class="chat-input__send"
    title="Send message"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 5l6 6m-6-6l-6 6m6-6v14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</form>
