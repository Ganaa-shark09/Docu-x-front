<details class="firewall-panel" *ngIf="firewall">
  <summary class="firewall-panel__summary">
    <span class="firewall-panel__title">Data firewall</span>

    <span class="firewall-panel__status">
      Checked
    </span>
  </summary>

  <p class="firewall-panel__description">
    Internal AI access policy applied to retrieved context.
  </p>

  <div class="firewall-panel__metrics">
    <span>
      <strong>{{ allowedCount }}</strong>
      Allowed
    </span>

    <span>
      <strong>{{ redactedCount }}</strong>
      Redacted
    </span>

    <span>
      <strong>{{ blockedCount }}</strong>
      Blocked
    </span>
  </div>

  <div class="firewall-panel__section" *ngIf="blockedItems.length">
    <h4>Blocked context</h4>

    <div class="firewall-panel__item firewall-panel__item--blocked" *ngFor="let item of blockedItems">
      <strong>{{ itemTitle(item) }}</strong>
      <span>{{ itemReason(item) }}</span>
    </div>
  </div>

  <div class="firewall-panel__section" *ngIf="allowedItems.length">
    <h4>Allowed context</h4>

    <div class="firewall-panel__item firewall-panel__item--allowed" *ngFor="let item of allowedItems">
      <strong>{{ itemTitle(item) }}</strong>
      <span>{{ itemReason(item) }}</span>
    </div>
  </div>
</details>
