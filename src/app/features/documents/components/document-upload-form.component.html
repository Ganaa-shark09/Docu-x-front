<div class="upload-form-card">
  <div class="upload-form-card__header">
    <div>
      <h3>Upload Internal Document</h3>
      <p>Upload company documents for Internal AI processing.</p>
    </div>

    <button type="button" class="upload-form-card__close" (click)="cancel()">
      ×
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="upload-form">
    <label>
      Title
      <input
        type="text"
        formControlName="title"
        placeholder="Invoice March 2026"
      />
    </label>

    <label>
      Description
      <textarea
        formControlName="description"
        rows="3"
        placeholder="Optional document notes"
      ></textarea>
    </label>

    <div class="upload-form__grid">
      <label>
        Document Type
        <select formControlName="document_type">
          <option value="invoice">Invoice</option>
          <option value="contract">Contract</option>
          <option value="policy">Policy</option>
          <option value="resume">Resume</option>
          <option value="purchase_order">Purchase Order</option>
          <option value="report">Report</option>
          <option value="other">Other</option>
        </select>
      </label>

      <label>
        Sensitivity
        <select formControlName="sensitivity_label">
          <option value="public">Public</option>
          <option value="internal">Internal</option>
          <option value="confidential">Confidential</option>
          <option value="highly_confidential">Highly Confidential</option>
          <option value="restricted">Restricted</option>
        </select>
      </label>

      <label>
        Department
        <select formControlName="department">
          <option value="">No department</option>
          <option *ngFor="let department of departments" [value]="department.uuid">
            {{ department.name }}
          </option>
        </select>
      </label>
    </div>

    <label>
      File
      <input
        type="file"
        (change)="onFileSelected($event)"
      />
    </label>

    <p *ngIf="selectedFile" class="upload-form__selected-file">
      Selected: {{ selectedFile.name }} · {{ formatFileSize(selectedFile.size) }}
    </p>

    <div *ngIf="errorMessage" class="upload-form__error">
      {{ errorMessage }}
    </div>

    <div class="upload-form__actions">
      <button type="button" class="upload-form__secondary" (click)="cancel()">
        Cancel
      </button>

      <button
        type="submit"
        class="upload-form__primary"
        [disabled]="form.invalid || !selectedFile || isUploading"
      >
        {{ isUploading ? 'Uploading...' : 'Upload Document' }}
      </button>
    </div>
  </form>
</div>
